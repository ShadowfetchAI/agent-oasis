name: AgentOasis
options:
  # Override with AGENT_OASIS_BUNDLE_PREFIX to ship your own build.
  bundleIdPrefix: ${AGENT_OASIS_BUNDLE_PREFIX}
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0.1"
    CURRENT_PROJECT_VERSION: "7"
    # Empty by default so a clone builds for anyone. Set AGENT_OASIS_DEVELOPMENT_TEAM in
    # your environment (or pass DEVELOPMENT_TEAM=... to xcodebuild) to sign with your own
    # Apple team. Hardcoding one person's team ID is what makes an open source Xcode project
    # un-buildable for everybody else.
    DEVELOPMENT_TEAM: ${AGENT_OASIS_DEVELOPMENT_TEAM}
    # 'targeted' surfaces real data races in the @Published store and its async
    # work. 'minimal' silenced the diagnostics rather than the races.
    SWIFT_STRICT_CONCURRENCY: targeted
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      # Xcode injects com.apple.security.get-task-allow for development-signed builds, and it
      # was present in the shipped Release product - verified with `codesign -d --entitlements`.
      # That entitlement lets ANY process running as the user attach a debugger and read the
      # workspace key straight out of memory, which defeats the Keychain, the owner gate and
      # the encryption all at once. It also makes a hardened-runtime build fail notarization.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  AgentOasis:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AgentOasis
    settings:
      base:
        PRODUCT_NAME: Agent Oasis
        PRODUCT_BUNDLE_IDENTIFIER: ${AGENT_OASIS_BUNDLE_PREFIX}.AgentOasis
        INFOPLIST_FILE: AgentOasis/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentOasis/AgentOasis.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    scheme:
      testTargets:
        - AgentOasisTests
      gatherCoverageData: true

  AgentOasisTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/AgentOasisTests
      - path: AgentOasis/Models/DomainModels.swift
      - path: AgentOasis/Security/WorkspaceCipher.swift
      - path: AgentOasis/Security/EncryptedWorkspaceRepository.swift
      - path: AgentOasis/Services/AnalyticsEngine.swift
      - path: AgentOasis/Services/AttentionEngine.swift
      - path: AgentOasis/Services/DecisionEngine.swift
      - path: AgentOasis/Services/ExecutiveBriefingService.swift
      - path: AgentOasis/Services/DelimitedTextParser.swift
      - path: AgentOasis/Services/ImportExportService.swift
      - path: AgentOasis/Services/HermesConnector.swift
      - path: AgentOasis/Services/AppStoreConnectConnector.swift
      # OasisStore is 689 lines holding every lock, unlock, persist and restore path - the
      # code most able to lose a user's only copy of their data - and it was not compiled
      # into the test target at all, so it could not be tested even in principle.
      - path: AgentOasis/Models/OasisStore.swift
      - path: AgentOasis/Security/KeychainService.swift
      - path: AgentOasis/Security/DeviceOwnerAuthenticator.swift
      - path: AgentOasis/Services/CredentialInventoryService.swift
    settings:
      base:
        PRODUCT_NAME: AgentOasisTests
        PRODUCT_BUNDLE_IDENTIFIER: ${AGENT_OASIS_BUNDLE_PREFIX}.AgentOasisTests
        GENERATE_INFOPLIST_FILE: YES
